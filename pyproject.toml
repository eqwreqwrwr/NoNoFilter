[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nono-filter"
version = "0.1.0"
description = "Offline audiobook profanity review and censoring tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Robert Blaise" }
]
license = { text = "CC BY-NC-SA 4.0" }
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "soundfile>=0.12",
    "rapidfuzz>=3.0",
    "PySide6>=6.6",
    "faster-whisper>=1.0",
    "nemo-toolkit[asr]>=2.0.0",
    "omegaconf",
    "ml-dtypes>=0.5.0",
    "protobuf>=6.31.1",
    "six>=1.17.0"
]

[project.scripts]
nono-filter = "nono_filter.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
